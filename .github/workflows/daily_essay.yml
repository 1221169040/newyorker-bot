name: Daily New Yorker Essay Delivery

on:
  schedule:
    # Runs every day at 12:00 PM UTC (Adjust cron timing to preference)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows you to trigger it manually from GitHub anytime

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot.py
